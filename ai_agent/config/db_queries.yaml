# Database Validation Queries
# Based on ACTUAL schema of: mysql_hcp_targetandsegmentation_dev
#
# Real tables (confirmed):
#   auth_user            – id, password, last_login, username, email, is_active, date_joined
#   django_session       – session_key, session_data, expire_date
#   segments             – id, name, description, filters, target_hcp_count, created_by, created_at, updated_at, type
#   targets              – id, name, description, target_hcp_count, created_by, created_at, updated_at, deleted_at
#   segment_target_mapping – id, segment_id, target_id, created_at
#
# Only add queries for modules that are implemented and tested.
# Use {email}, {username} etc. as runtime-replaced variables.
# All queries are SELECT-only.

modules:

  # ── Login / Authentication ────────────────────────────────────────────────
  # Table: auth_user, django_session
  login:
    patterns: ["login", "auth", "signin", "authentication", "session"]
    queries:

      - name: "verify_user_exists_and_active"
        table: "auth_user"
        column: "is_active"
        sql: "SELECT is_active FROM auth_user WHERE email = '{email}' LIMIT 1"
        condition: "= 1"
        expected: "auth_user.is_active = 1 for the logged-in user"
        description: "Verify user account is active in auth_user table"
        variables: ["email"]

      - name: "verify_last_login_updated"
        table: "auth_user"
        column: "last_login"
        sql: "SELECT last_login FROM auth_user WHERE email = '{email}' LIMIT 1"
        condition: "IS NOT NULL"
        expected: "auth_user.last_login is not null after login"
        description: "Verify last_login timestamp was updated on successful login"
        variables: ["email"]

      - name: "verify_session_exists"
        table: "django_session"
        column: "session_key"
        sql: "SELECT COUNT(*) FROM django_session WHERE expire_date > NOW()"
        condition: "> 0"
        expected: "At least 1 active session exists in django_session"
        description: "Verify a valid non-expired session exists after login"
        variables: []

