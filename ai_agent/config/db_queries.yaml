# Database Validation Queries - Module-Based Configuration
# Queries are organized by module type and auto-matched to test cases
# Use variables {email}, {search_term}, {name} etc. for dynamic values

# Module: Authentication & Login
# Matches: Any test with "login" or "auth" in the name
modules:
  login:
    patterns: ["login", "auth", "signin", "authentication"]
    queries:
      - name: "verify_last_login_updated"
        sql: "SELECT last_login FROM users WHERE email = '{email}' AND last_login IS NOT NULL"
        expected: "Returns 1 row with recent timestamp"
        description: "Verify user's last_login timestamp updated"
        variables: ["email"]
      
      - name: "verify_login_count_incremented"
        sql: "SELECT login_count FROM users WHERE email = '{email}' AND login_count > 0"
        expected: "Returns 1 row with count > 0"
        description: "Verify login counter incremented"
        variables: ["email"]
      
      - name: "verify_session_created"
        sql: "SELECT * FROM user_sessions WHERE user_id = (SELECT id FROM users WHERE email = '{email}') AND active = 1 ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 active session"
        description: "Verify active session exists for user"
        variables: ["email"]
  
  # Module: Search & Filtering
  # Matches: Any test with "search" or "filter" in the name
  search:
    patterns: ["search", "filter", "find", "query"]
    queries:
      - name: "verify_search_results_exist"
        sql: "SELECT COUNT(*) as count FROM hcp_profiles WHERE name LIKE '%{search_term}%'"
        expected: "Returns count > 0"
        description: "Verify database has matching records"
        variables: ["search_term"]
      
      - name: "verify_search_logged"
        sql: "SELECT * FROM search_logs WHERE search_term = '{search_term}' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 recent search log"
        description: "Verify search activity logged for analytics"
        variables: ["search_term"]
      
      - name: "verify_filter_results"
        sql: "SELECT COUNT(*) as count FROM hcp_profiles WHERE specialty = '{specialty}' AND state = '{state}'"
        expected: "Returns count > 0"
        description: "Verify filtered results match criteria"
        variables: ["specialty", "state"]
  
  # Module: Segments
  # Matches: Any test with "segment" in the name
  segments:
    patterns: ["segment", "cohort", "group"]
    queries:
      - name: "verify_segment_created"
        sql: "SELECT * FROM segments WHERE name = '{segment_name}' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 row with new segment"
        description: "Verify segment created in database"
        variables: ["segment_name"]
      
      - name: "verify_segment_hcp_count"
        sql: "SELECT hcp_count FROM segments WHERE name = '{segment_name}' AND hcp_count > 0"
        expected: "Returns count > 0"
        description: "Verify segment has HCPs assigned"
        variables: ["segment_name"]
      
      - name: "verify_segment_filters"
        sql: "SELECT filters FROM segments WHERE name = '{segment_name}'"
        expected: "Returns JSON with filter criteria"
        description: "Verify segment filters saved correctly"
        variables: ["segment_name"]
  
  # Module: User Registration
  # Matches: Any test with "register" or "signup" in the name
  registration:
    patterns: ["register", "signup", "create_user", "create_account"]
    queries:
      - name: "verify_user_created"
        sql: "SELECT * FROM users WHERE email = '{email}' AND status = 'active'"
        expected: "Returns 1 row"
        description: "Verify new user record exists"
        variables: ["email"]
      
      - name: "verify_user_profile_created"
        sql: "SELECT * FROM user_profiles WHERE user_id = (SELECT id FROM users WHERE email = '{email}')"
        expected: "Returns 1 row"
        description: "Verify user profile initialized"
        variables: ["email"]
      
      - name: "verify_welcome_email_queued"
        sql: "SELECT * FROM email_queue WHERE recipient = '{email}' AND template = 'welcome' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 row"
        description: "Verify welcome email queued"
        variables: ["email"]
  
  # Module: Data Export
  # Matches: Any test with "export" or "download" in the name
  export:
    patterns: ["export", "download", "csv", "excel"]
    queries:
      - name: "verify_export_logged"
        sql: "SELECT * FROM export_logs WHERE user_id IS NOT NULL AND export_type = '{export_type}' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 row"
        description: "Verify export action logged for compliance"
        variables: ["export_type"]
      
      - name: "verify_export_record_count"
        sql: "SELECT record_count FROM export_logs ORDER BY created_at DESC LIMIT 1"
        expected: "Returns count > 0"
        description: "Verify export contains data"
        variables: []
  
  # Module: Security
  # Matches: Any test with "security" or "injection" in the name
  security:
    patterns: ["security", "injection", "xss", "sql_injection", "attack"]
    queries:
      - name: "verify_security_event_logged"
        sql: "SELECT * FROM security_logs WHERE event_type = '{event_type}' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 row"
        description: "Verify security event logged"
        variables: ["event_type"]
      
      - name: "verify_failed_login_logged"
        sql: "SELECT * FROM login_attempts WHERE email = '{email}' AND status = 'failed' ORDER BY created_at DESC LIMIT 1"
        expected: "Returns 1 row"
        description: "Verify failed login attempt recorded"
        variables: ["email"]

# Generic/Fallback Queries
# Applied when no module pattern matches
generic:
  patterns: ["*"]  # Matches everything
  queries:
    - name: "verify_recent_activity"
      sql: "SELECT * FROM activity_logs WHERE user_id IS NOT NULL ORDER BY created_at DESC LIMIT 5"
      expected: "Returns activity records"
      description: "Verify recent system activity"
      variables: []

# Notes:
# - All queries are SELECT-only (no INSERT, UPDATE, DELETE)
# - Use parameterized queries in executor to prevent SQL injection
# - Test data should be cleaned up after test execution
# - Queries should be idempotent (safe to run multiple times)
