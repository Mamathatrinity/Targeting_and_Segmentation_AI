# ─────────────────────────────────────────────────────────────────────────
# MERGED: Strategy + RAG + Planning  →  1 LLM call
# Replaces two separate calls (StrategyAgent + PlannerAgent)
# Backup of original prompts in: ai_agent/prompts/backup/
# ─────────────────────────────────────────────────────────────────────────

STRATEGY: |
  Before generating scenarios, decide the testing strategy for this module.
  Use the MODULE STRATEGY hint and DOMAIN KNOWLEDGE below.

  STRATEGY RULES:
  - Login / Auth modules          → priority: critical, depth: deep
  - Business logic (segmentation, rules, filters) → priority: high, depth: deep
  - Dashboard / Reports / UI only → priority: medium, depth: light
  - If previous failures exist    → increase depth by one level
  - Complex modules (segmentation, target_lists, universe_summary) → use domain knowledge

  MODULE STRATEGY: {module_strategy}

DOMAIN_KNOWLEDGE: |
  Retrieved domain context for this module (RAG, k=2 — use only if relevant):
  {rag_context}

GOAL: |
  Generate COMPREHENSIVE test case scenarios from UI data that are specific, actionable, and Excel-ready.
  Each scenario must include: WHAT to test, WITH WHAT data, and EXPECT WHAT result.

  **SCENARIO COUNT — driven by depth decided in STRATEGY above:**
  - depth: light  → minimum 10 total  (4 positive, 3 edge, 3 negative)
  - depth: medium → minimum 20 total  (8 positive, 6 edge, 6 negative)
  - depth: deep   → minimum 30 total  (12 positive, 10 edge, 8 negative)

  IMPORTANT: Use the depth value from STRATEGY. Do NOT default to deep for every module.
  Think exhaustively about ALL possible user interactions, data variations, security vulnerabilities, and edge conditions.

CONTEXT: |
  - Input: UI elements (inputs, buttons, dropdowns, links) + business description
  - Output: Comprehensive test scenarios in JSON format (positive, edge cases, negative scenarios)
  - Domain: {domain_context} (application-specific context provided dynamically)
  - Compliance: {compliance_requirements} (security, data privacy, regulatory requirements)
  - Focus Area: {focus_area} (if specified, concentrate scenarios on this specific area)
  - Format: JSON with specific test data values and expected outcomes
  - Purpose: These scenarios will be converted to detailed E2E test steps (UI + API + DB) by Designer agent

ALLOWED:
  - Positive scenarios: Normal user workflows with valid, realistic data
  - Edge cases: Boundary conditions (min/max values, empty optional fields, special characters)
  - Negative scenarios: Invalid data, security testing (SQL injection, XSS), error handling
  - Specific test data: Use contextually appropriate data based on UI element types
  - Expected outcomes: Explicit success messages, page redirects, error messages
  - Multi-step flows: Complete user journeys from entry to exit
  - Domain-specific tests: Use application context to generate relevant b usiness scenarios

NOT_ALLOWED:
  - Vague scenarios without expected results (e.g., "User logs in")
  - Generic test data (e.g., "valid email" instead of "john.doe@healthcare.com")
  - Scenarios without specific data values
  - Tests requiring external systems not visible in UI data
  - Scenarios that cannot be automated (e.g., "Check email inbox")
  - Duplicate or overlapping scenarios

QUALITY_CHECK: |
  Flag needs_clarification if:
  - Scenario lacks expected result ("and sees Dashboard", "and gets error")
  - Test data is generic ("valid email" vs "test@example.com")
  - Action is vague ("test login" vs "login with email X and password Y")
  - No specific values provided for inputs

TEST_CASE_RULES:
  specificity:
    - "Use exact test data: 'john.doe@example.com' not 'valid email'"
    - "State expected outcomes: 'and sees Welcome message' not just 'logs in'"
    - "Include all input values from the UI elements provided"
  
  realistic_data:
    - "Use domain-appropriate values based on application context"
    - "Use realistic formats for all data types (emails, dates, numbers, text)"
    - "Use strong passwords when applicable: SecurePass123!"
  
  expected_results:
    - "Every scenario must end with expected outcome"
    - "Success scenarios: 'and sees Dashboard', 'and receives confirmation', 'and record appears in table'"
    - "Error scenarios: 'and sees Invalid credentials error', 'and gets 400 error', 'and validation message displays'"
  
  excel_ready:
    - "Write in clear, professional language"
    - "Use proper grammar and punctuation"
    - "Make it understandable for manual testers"
    - "Avoid technical jargon unless necessary"

THINK_STEPWISE: |
  1. Run QUALITY_CHECK - scenarios must have specific data + expected results
  2. Analyze UI elements:
     - What input fields exist and what data types do they accept?
     - What action buttons are available and what do they trigger?
     - What selection controls are present (dropdowns, checkboxes, radio buttons)?
     - What navigation elements exist (links, menus, breadcrumbs)?
     - What data display components are present (tables, grids, cards)?
  3. Identify user workflows:
     - What are common user journeys based on the UI flow?
     - What business goals can be achieved with these UI elements?
     - What CRUD operations are supported?
  4. Write positive scenarios (count based on depth: light=4, medium=8, deep=12):
     - Happy paths with valid data (different valid formats)
     - Most common user workflows
     - Multi-step flows representing real usage
     - Cover primary business functions
     - Different data combinations
     - Session and state management
     - Browser features (autofill, remember me, etc.)
  5. Write edge cases (count based on depth: light=3, medium=6, deep=10):
     - Boundary values (max/min length inputs, empty optional fields)
     - Unusual but valid inputs (special characters, very long text, unicode)
     - Rapid actions (double-click, multiple submissions, quick navigation)
     - Concurrent operations (multiple tabs, simultaneous edits)
     - Browser navigation (back, forward, refresh)
     - Copy-paste, keyboard shortcuts, tab navigation
     - Field trimming, case sensitivity, data formatting
     - Optional vs required field combinations
  6. Write negative scenarios (count based on depth: light=3, medium=6, deep=8):
     - Invalid data formats based on field validation rules
     - Security tests (SQL injection, XSS attempts, unauthorized access)
     - Missing required fields, duplicate entries, constraint violations
     - Business rule violations based on application logic
     - Rate limiting, brute force attempts
     - Malformed inputs, incorrect data types
     - Session expiration, unauthorized access
     - Cross-site request forgery attempts
  7. Generate coverage matching the depth from STRATEGY:
     - light  → ~10 total (4+3+3)
     - medium → ~20 total (8+6+6)
     - deep   → ~30 total (12+10+8)
  8. Verify each scenario has:
     - ACTION: What user does
     - DATA: Specific values used
     - EXPECTED_RESULT: What should happen

OUTPUT_JSON: |
  {
    "positive_scenarios": [
      "List based on depth — light: 4, medium: 8, deep: 12 scenarios"
    ],
    "edge_cases": [
      "List based on depth — light: 3, medium: 6, deep: 10 scenarios"
    ],
    "negative_scenarios": [
      "List based on depth — light: 3, medium: 6, deep: 8 scenarios"
    ]
  }

  Use the depth from the STRATEGY section to decide count. Do not always generate 30+.

FEW_SHOT_EXAMPLES:
  - example: "Login/Authentication Page"
    ui_data:
      inputs:
        - label: "Email"
          type: "email"
        - label: "Password"
          type: "password"
      buttons:
        - text: "Login"
      links:
        - text: "Forgot Password?"
    output:
      positive_scenarios:
        - "User logs in with email 'john.doe@example.com' and password 'SecurePass123!' and sees 'Welcome, John' message on Dashboard"
        - "User authenticates with email 'admin@company.com' and password 'Admin@2024', is redirected to /dashboard, and sees user profile icon"
        - "User logs in with email 'test.user@domain.org' and password 'Test!Pass99', session cookie is set, and last login timestamp updates"
      edge_cases:
        - "User enters 254-character email and valid password 'Pass123!', system accepts and displays Dashboard successfully"
        - "User clicks Login with only Email filled (no password), system shows 'Password is required' validation error"
        - "User enters email 'user+tag@domain.com' (with plus sign) and password 'Valid123!', system accepts and logs in successfully"
      negative_scenarios:
        - "User enters SQL injection 'admin' OR '1'='1' -- in email field, system shows 'Invalid email format' and blocks login"
        - "User enters wrong password 'WrongPass' for email 'test@test.com', system shows 'Invalid credentials' error"
        - "User leaves both fields empty and clicks Login, system shows 'Email and Password are required' validation error"

  - example: "Search and Filter Page"
    ui_data:
      inputs:
        - placeholder: "Search by name"
      dropdowns:
        - label: "Category"
          options: ["All", "Electronics", "Books", "Clothing"]
        - label: "Status"
          options: ["All", "Active", "Inactive"]
      buttons:
        - text: "Apply Filters"
        - text: "Reset"
    output:
      positive_scenarios:
        - "User searches for 'Product A', clicks Apply Filters, and sees results table showing 'Product A' entries with IDs"
        - "User selects Category 'Electronics', Status 'Active', clicks Apply Filters, and sees 'Showing 45 Active Electronics' message"
        - "User applies filters (Category: 'Books', Status: 'Active'), sees filtered list, and API returns 200 with matching data"
        - "User clicks Reset after applying filters, all dropdowns return to 'All', and sees 'Showing all results' message"
      edge_cases:
        - "User searches for name with special characters 'O'Brien-Smith' and sees matching results displayed correctly"
        - "User applies all filters simultaneously (Name: 'Product', Category: 'Electronics', Status: 'Active') and sees combined results"
        - "User enters 100-character search term, clicks Apply, system processes without error showing results or 'No matches'"
      negative_scenarios:
        - "User searches for non-existent item 'XYZ123NonExistent', clicks Apply, sees 'No results found. Try adjusting filters'"
        - "User attempts SQL injection in search 'Product' OR '1'='1', system sanitizes input and returns safe 'No results found'"
        - "User clicks Apply without entering any criteria, system shows all records or 'Please enter search criteria' message"

  - example: "Create/Edit Form"
    ui_data:
      inputs:
        - label: "Name"
          type: "text"
        - label: "Email"
          type: "email"
        - label: "Phone"
          type: "tel"
        - label: "Amount"
          type: "number"
      dropdowns:
        - label: "Status"
          options: ["Active", "Inactive"]
      buttons:
        - text: "Save"
        - text: "Cancel"
    output:
      positive_scenarios:
        - "User creates record with Name 'John Smith', Email 'john@example.com', Phone '555-1234', Amount '100', Status 'Active', clicks Save, and sees 'Record created successfully'"
        - "User edits existing record, changes Amount from '100' to '200', clicks Save, and sees 'Record updated successfully' with new value displayed"
        - "User fills all required fields, leaves optional Phone empty, clicks Save, and record is created without errors"
      edge_cases:
        - "User enters maximum length Name (255 characters), system accepts and saves successfully"
        - "User enters Amount '0.01' (minimum), clicks Save, and record is created with correct decimal value"
        - "User clicks Save twice rapidly, system prevents duplicate submission and shows 'Already processing' message"
      negative_scenarios:
        - "User leaves required Name field empty, clicks Save, and sees 'Name is required' validation error"
        - "User enters invalid email 'notanemail', clicks Save, and sees 'Please enter valid email address' error"
        - "User enters negative Amount '-50', clicks Save, and sees 'Amount must be positive' validation error"

  - example: "Data Table/Grid with Actions"
    ui_data:
      table:
        columns: ["ID", "Name", "Email", "Status", "Actions"]
        row_actions: ["Edit", "Delete", "View Details"]
      buttons:
        - text: "Add New"
        - text: "Export to Excel"
      pagination:
        - "Previous"
        - "1"
        - "2"
        - "3"
        - "Next"
    output:
      positive_scenarios:
        - "User clicks 'Add New' button, is redirected to create form, and sees empty form with 'Create New Record' title"
        - "User clicks 'Edit' on row with Name 'John Smith', sees edit form pre-filled with existing data, and can modify values"
        - "User sorts table by 'Name' column ascending, table reorders alphabetically, and API returns sorted data"
        - "User clicks 'Export to Excel' button, file downloads successfully, and contains all visible table data"
      edge_cases:
        - "User navigates to page 10 with only 3 records, sees 3 records displayed and pagination shows 'Page 10 of 10'"
        - "User clicks 'Edit' and 'Delete' simultaneously on same row, system processes only first action"
        - "User exports table with 10,000 rows, download completes without timeout, and file size is appropriate"
      negative_scenarios:
        - "User clicks 'Delete' on already-deleted record, system shows 'Record not found' error"
        - "User tries to edit record without permission, sees 'Access denied' message"
        - "User navigates to invalid page number (page 999 when only 10 pages exist), sees 'Invalid page' error or redirects to last page"

  - example: "Dashboard/Reports Page"
    ui_data:
      widgets:
        - "Total Revenue: $X"
        - "Active Users: Y"
        - "Orders Today: Z"
      charts:
        - type: "Bar Chart"
          title: "Sales by Month"
        - type: "Pie Chart"
          title: "Revenue by Category"
      filters:
        - label: "Date Range"
          options: ["Today", "Last 7 Days", "Last 30 Days", "Custom"]
      buttons:
        - text: "Refresh"
        - text: "Export Report"
    output:
      positive_scenarios:
        - "User selects 'Last 7 Days' filter, clicks Refresh, and dashboard updates showing data for past 7 days with correct totals"
        - "User views dashboard on load, sees current day's metrics, and 'Total Revenue' widget displays formatted currency"
        - "User clicks 'Export Report' button, PDF/Excel downloads with current dashboard data and selected date range"
      edge_cases:
        - "User selects 'Custom' date range with start and end on same day, dashboard shows single-day data correctly"
        - "User refreshes dashboard while data is loading, previous request cancels and new data loads"
        - "User views dashboard with no data for selected period, widgets show '0' or 'No data available' message"
      negative_scenarios:
        - "User selects 'Custom' date range with end date before start date, sees 'Invalid date range' validation error"
        - "User tries to export report with 1 million records, system shows 'Dataset too large, please filter data' error"
        - "User accesses dashboard without required permissions, sees 'Access denied - Admin only' message"

