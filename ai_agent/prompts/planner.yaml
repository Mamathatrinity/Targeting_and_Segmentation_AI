# Planner Prompt — Strategy + RAG + Scenario Generation (1 LLM call)
# All {placeholders} are injected at runtime from planner.py
# To change domain / counts / examples → update ai_agent/config.py, not this file

# ── Step 1: Decide testing strategy ──────────────────────────────────────
STRATEGY: |
  Look at the module and decide the testing strategy before writing scenarios.

  Rules:
{strategy_rules}

  Module info: {module_strategy}

# ── Step 2: Domain knowledge (from RAG — use only if relevant) ───────────
DOMAIN_KNOWLEDGE: |
  {rag_context}

# ── Step 3: What to generate ─────────────────────────────────────────────
TASK: |
  Generate test scenarios from the UI data below.
  Domain:           {domain_context}
  Compliance:       {compliance_requirements}
  Focus area:       {focus_area}
  Business context: {user_description}
  UI elements:      {ui_data}

  Scenario counts — use the depth you chose in STRATEGY:
{scenario_counts}

# ── Step 4: Rules ─────────────────────────────────────────────────────────
RULES: |
  Every scenario MUST have:
  - A specific action   (what the user does)
  - Specific data       (exact values, not "valid email" or "some text")
  - An expected result  (what should appear or happen)

  DO:
  - Use domain-appropriate test data based on {domain_context}
  - Cover happy paths, boundary values, and error / security cases
  - Write in plain language that a manual tester can follow

  DO NOT:
  - Write vague scenarios like "User logs in successfully"
  - Use placeholder data without context
  - Repeat or overlap scenarios
  - Include tests that cannot be automated from the UI
  - Invent UI elements or fields not present in {ui_data}

# ── Step 5: Output format ─────────────────────────────────────────────────────
OUTPUT: |
  Return ONLY this JSON — all keys required, no prose, no markdown:
  {
    "positive_scenarios": ["..."],
    "edge_cases":         ["..."],
    "negative_scenarios": ["..."]
  }

  {format_instructions}

# ── Step 6: Examples ──────────────────────────────────────────────────────
EXAMPLES:
{few_shot_examples}
