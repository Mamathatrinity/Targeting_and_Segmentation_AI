# Validator Prompt — Test Result Analysis + Decision Engine (1 LLM call)
# All {placeholders} are injected at runtime from validator.py
# Merged: ValidatorAgent + DecisionEngine — backup in ai_agent/prompts/backup/

# ── What to do ───────────────────────────────────────────────────────────
TASK: |
  Analyze test execution results for module: {module_name}
  Results: {results_summary}

  For every test:
  1. Compare actual result against expected — mark PASSED or FAILED
  2. If FAILED: identify WHY (root cause), not just what failed
  3. If failure is a broken selector or timing issue: suggest a healed selector
  4. Assign confidence: high (clear match/mismatch) | medium (partial) | low (ambiguous)

# ── Failure types ─────────────────────────────────────────────────────────
FAILURE_TYPES: |
  - ui_failure      → element not found, selector changed, timing, text mismatch
  - api_failure     → wrong status code, missing fields, timeout
  - data_failure    → data not saved, wrong value in DB, constraint violation
  - validation_failure → expected outcome was wrong, flaky assertion, test data issue

# ── Rules ─────────────────────────────────────────────────────────────────
RULES: |
  - Include root_cause for ALL failed tests
  - Include self_healing only when the failure is a selector or element issue
  - decisions.tests_to_rerun: selector or timing failures only (auto-heal candidates)
  - decisions.tests_to_skip_next: persistent failures or cosmetic-only tests
  - decisions.priority_tests_next_run: critical / auth / business-logic tests first
  - Return ONLY valid JSON — no markdown, no prose, no code blocks

# ── Output format ─────────────────────────────────────────────────────────
OUTPUT: |
  Return ONLY this JSON — all keys required, no prose, no markdown:
  {
    "validation_results": [
      {
        "test_name": "string",
        "status": "PASSED|FAILED",
        "confidence": "high|medium|low",
        "failure_category": "ui_failure|api_failure|data_failure|validation_failure",
        "root_cause": {
          "primary_reason": "WHY it failed",
          "evidence": ["error message or observation"],
          "likely_cause": "most probable explanation"
        },
        "self_healing": {
          "applicable": true,
          "broken_selector": "old selector",
          "suggested_selector": "new selector",
          "alternative_selectors": ["fallback 1", "fallback 2"],
          "confidence": "high|medium|low",
          "reasoning": "why the new selector works"
        },
        "failure_reason": "human-readable explanation",
        "actual_result": "what happened",
        "expected_result": "what was expected",
        "recommendations": ["fix 1", "fix 2"]
      }
    ],
    "summary": {
      "total_tests": 0,
      "passed": 0,
      "failed": 0,
      "pass_rate": "0.0%",
      "self_healing_opportunities": 0
    },
    "decisions": {
      "tests_to_rerun": ["selector/timing failures only"],
      "tests_to_skip_next": ["persistent or low-value failures"],
      "priority_tests_next_run": ["top 5 highest-impact tests for next run"]
    }
  }

# ── Example ────────────────────────────────────────────────────────────────
EXAMPLE: |
  {
    "validation_results": [
      {
        "test_name": "Successful login with valid credentials",
        "status": "PASSED",
        "confidence": "high",
        "actual_result": "User redirected to /dashboard, welcome message displayed: 'Welcome back, John Doe'",
        "expected_result": "User redirected to dashboard with welcome message"
      },
      {
        "test_name": "Login with invalid password",
        "status": "FAILED",
        "confidence": "high",
        "failure_category": "ui_failure",
        "root_cause": {
          "primary_reason": "Error message element selector has changed - old selector '#error-msg' no longer exists",
          "evidence": [
            "Playwright error: 'Selector not found: #error-msg'",
            "Page inspection shows error message uses class '.error-text' instead",
            "HTML structure changed in recent deployment"
          ],
          "likely_cause": "UI refactoring changed error message element from ID to class-based selector"
        },
        "self_healing": {
          "applicable": true,
          "broken_selector": "#error-msg",
          "suggested_selector": ".error-text",
          "alternative_selectors": ["[data-testid='login-error']", "//p[contains(@class, 'error')]"],
          "confidence": "high",
          "reasoning": "Page currently has element with class 'error-text' containing error message text"
        },
        "failure_reason": "Expected error message 'Invalid credentials' not found using selector #error-msg",
        "actual_result": "No error message detected with selector #error-msg, form remained on login page",
        "expected_result": "Error message 'Invalid credentials' displayed below password field",
        "recommendations": [
          "Update test to use selector: .error-text",
          "Consider using data-testid attributes for stability",
          "Add fallback selectors in case of future changes"
        ]
      },
      {
        "test_name": "Create new user via API",
        "status": "FAILED",
        "confidence": "medium",
        "failure_category": "api_failure",
        "root_cause": {
          "primary_reason": "Database connection timeout causing API to return 500 error",
          "evidence": [
            "API response: 'Database connection timeout'",
            "Response time: 31 seconds (timeout is 30s)",
            "Multiple similar failures in test run"
          ],
          "likely_cause": "Database server is slow or unresponsive, possibly under heavy load or maintenance"
        },
        "self_healing": {
          "applicable": false
        },
        "failure_reason": "API returned 500 Internal Server Error instead of 201 Created",
        "actual_result": "Status: 500, Body: {\"error\": \"Database connection timeout\"}",
        "expected_result": "Status: 201, Body: {\"id\": 123, \"email\": \"newuser@example.com\"}",
        "recommendations": [
          "Verify database server status and connectivity",
          "Increase API timeout if database operations are legitimately slow",
          "Check for database performance issues or locks",
          "Consider retrying test after database issue is resolved"
        ]
      }
    ],
    "summary": {
      "total_tests": 3,
      "passed": 1,
      "failed": 2,
      "pass_rate": "33.3%",
      "self_healing_opportunities": 1
    },
    "decisions": {
      "tests_to_rerun": ["Login with invalid password"],
      "tests_to_skip_next": [],
      "priority_tests_next_run": ["Login with invalid password", "Create new user via API", "Successful login with valid credentials"]
    }
  }
