# Designer Prompt — Scenario → Executable Test Steps (1 LLM call)
# All {placeholders} are injected at runtime from designer.py
# Depth is decided by PlannerAgent and passed through — do not override it here

# ── What to generate ─────────────────────────────────────────────────────
TASK: |
  Convert each test scenario into executable test steps.
  Scenarios: {scenarios}
  UI elements: {ui_elements}
  Testing depth: {depth}

  Layer selection — use the depth above, do not add layers beyond what depth allows:
  - depth: light  → UI steps only
  - depth: medium → UI steps + API verification
  - depth: deep   → UI steps + API verification + DB verification

# ── Rules ────────────────────────────────────────────────────────────────
RULES: |
  Every test case MUST have:
  - A navigate step first (go to the URL)
  - Fill / click steps for each user action with exact values from the scenario
  - At least one verify step at the end with a specific expected result

  DO:
  - Use exact values from the scenario (e.g. email, passwords, filter values)
  - Use specific selectors — not just "button" but "Login button"
  - Add API steps only if depth is medium or deep
  - Add DB steps only if depth is deep
  - DB queries must be SELECT only — no INSERT/UPDATE/DELETE

  DO NOT:
  - Add layers that exceed the depth (e.g. no DB steps for depth: light)
  - Write vague expected results like "page loads"
  - Invent UI elements not present in {ui_elements}
  - Write multiple SQL statements in one DB step

# ── Output format ─────────────────────────────────────────────────────────
OUTPUT: |
  Return ONLY this JSON — all keys required, no prose, no markdown:
  {
    "test_cases": [
      {
        "name": "test_<action>_<scenario_type>",
        "description": "one sentence describing what this test validates",
        "steps": [
          {"action": "navigate",    "target": "url",    "value": "https://...",   "expected": "Page loads",        "layer": "UI"},
          {"action": "fill",        "target": "Email",  "value": "user@co.com",   "expected": "Field populated",   "layer": "UI"},
          {"action": "click",       "target": "Login",  "value": "",              "expected": "Form submitted",    "layer": "UI"},
          {"action": "verify_text", "target": "",       "value": "",              "expected": "Dashboard visible", "layer": "UI"},
          {"action": "verify_api",  "endpoint": "/api/auth/session", "expected_status": 200, "expected": "Session active", "layer": "API"},
          {"action": "verify_db",   "table": "users", "column": "last_login", "condition": "IS NOT NULL WHERE email='user@co.com'", "expected": "Login recorded", "layer": "DB"}
        ]
      }
    ]
  }

  {format_instructions}

