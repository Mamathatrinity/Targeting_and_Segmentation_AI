[pytest]
# Pytest Configuration for AI Testing Framework

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directory
testpaths = tests

# Minimum Python version
minversion = 7.0

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --durations=10
    --color=yes
    -p no:warnings
    --html=reports/pytest_report.html
    --self-contained-html

# Custom markers for organizing tests
markers =
    smoke: Quick smoke tests (run first)
    regression: Full regression suite
    login: Login module tests
    segments: Segments module tests
    targets: Target list module tests
    dashboard: Dashboard module tests
    
    ui: UI-only tests (no API/DB)
    api: API integration tests
    database: Database validation tests
    full_stack: Full stack tests (UI + API + DB)
    
    slow: Tests that take longer than 30 seconds
    fast: Tests under 5 seconds
    
    ai_generated: Tests generated by AI agents
    manual: Manually written tests
    
    critical: P0 - Must pass for release
    high: P1 - High priority
    medium: P2 - Medium priority
    low: P3 - Low priority
    
    parallel: Safe to run in parallel
    serial: Must run sequentially

# Coverage reporting
[coverage:run]
source = ai_agent
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging)
timeout = 300
timeout_method = thread

# Parallel execution settings
[pytest-xdist]
looponfail = true
